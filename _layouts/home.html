<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

  <body style="min-height: 100vh; background-image: url('{{ site.background_image }}'); background-size: cover; background-position: center; background-repeat: no-repeat; display: flex; align-items: center; justify-content: center; margin: 0;">
    <div class="text-center">
      {% if site.logo_image %}
        <img src="{{ site.logo_image | relative_url }}" alt="{{ site.title | escape }}" style="max-width: min(70vw, 420px); height: auto; display: block; margin: 0 auto;">
      {% endif %}
    </div>
  </body>

</html>
